services:
    mailpit:
        image: axllent/mailpit
        container_name: mailpit
        restart: unless-stopped
        volumes:
            - github-images-mailpit:/data
        ports:
            - 8025:8025
            - 1025:1025
        environment:
            MP_MAX_MESSAGES: 5000
            MP_DATABASE: /data/mailpit.db
            MP_SMTP_AUTH_ACCEPT_ANY: 1
            MP_SMTP_AUTH_ALLOW_INSECURE: 1
        networks:
            - github-images-network

    mariadb:
        image: mariadb:12.2.2
        container_name: mariadb
        restart: unless-stopped
        volumes:
            - github-images-mariadb:/var/lib/mysql
        command:
            ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
        healthcheck:
            test: ["CMD", "/usr/local/bin/healthcheck.sh", "--innodb_initialized"]
            interval: 5s
            timeout: 3s
            retries: 5
        ports:
            - 3406:3306
        environment:
            MYSQL_ROOT_PASSWORD: toor
            MYSQL_DATABASE: app
            MYSQL_USER: appuser
            MYSQL_PASSWORD: password
            MARIADB_AUTO_UPGRADE: "1"
        networks:
            - github-images-network

    phpmyadmin:
        image: phpmyadmin:latest
        container_name: phpmyadmin
        restart: unless-stopped
        ports:
            - 8080:80
        environment:
            PMA_HOST: mariadb
            PMA_PORT: 3306
            PMA_USER: root
            PMA_PASSWORD: toor
        networks:
            - github-images-network
        depends_on:
            mariadb:
                condition: service_healthy

    nats:
        image: nats:2.12.5-linux
        container_name: nats
        restart: unless-stopped
        command: --config /nats-server.conf
        ports:
            - 4322:4222
            - 8322:8222
            - 9322:9222
        volumes:
            - ./files/nats.conf:/nats-server.conf
              - github-images-nats:/tmp/nats/jetstream
        networks:
            - github-images-network

    redis:
        image: redis:8.8.0
        container_name: redis
        restart: unless-stopped
        command: sh -c "redis-server /app/redis.conf"
        ports:
            - 6479:6379
        volumes:
            - ./files/redis.conf:/app/redis.conf
            - github-images-redis:/data
        networks:
            - github-images-network

    syncthing:
        image: syncthing/syncthing:2.1.0
        container_name: syncthing
        restart: unless-stopped
        ports:
            - 8384:8384
            - 22000:22000/tcp
            - 22000:20000/udp
            - 21027:21027/udp
        volumes:
            - github-images-syncthing-config:/config
        networks:
            - github-images-network

    n8n:
        image: docker.n8n.io/n8nio/n8n
        container_name: n8n
        restart: unless-stopped
        ports:
            - 5678:5678
        environment:
            DOMAIN_NAME: localhost
            SUBDOMAIN: n8n
            GENERIC_TIMEZONE: Europe/Bucharest
            SSL_EMAIL: example@email.com
            N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: true
            N8N_HOST: ${SUBDOMAIN}.${DOMAIN_NAME}
            N8N_PORT: 5678
            N8N_PROTOCOL: http
            NODE_ENV: local
            WEBHOOK_URL: http://${SUBDOMAIN}.${DOMAIN_NAME}/
            TZ: ${GENERIC_TIMEZONE}
        volumes:
            - github-images-n8n-data:/home/node/.n8n
            - ./files/n8n:/files

networks:
    github-images-network:
        driver: bridge

volumes:
    github-images-mailpit:
        driver: local
    github-images-mariadb:
        driver: local
    github-images-nats:
        driver: local
    github-images-redis:
        driver: local
    github-images-syncthing-config:
        driver: local
    github-images-n8n-data:
        driver: local
    
